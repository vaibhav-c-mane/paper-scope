<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperScope</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22none%22 stroke=%22%23c96442%22 stroke-width=%222.5%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">◎</span> PaperScope</div>
  <div class="small muted" id="state"></div>
</header>

<main class="page">
  <form id="search" class="search" autocomplete="off">
    <div class="box">
      <input id="q" placeholder="Search papers: plain words, AND / OR / NOT, -word, prefix*, DOI, arXiv or OpenAlex id">
      <button type="submit" class="go" title="Search">Search</button>
      <ul class="suggest hidden" id="suggest"></ul>
    </div>
    <div class="filters">
      <label>Year <input id="year_from" type="number" placeholder="from" min="1900" max="2100"> – <input id="year_to" type="number" placeholder="to" min="1900" max="2100"></label>
      <label>Author <input id="author" placeholder="e.g. Hinton"></label>
      <label>Field <select id="field"><option value="">detect automatically</option></select></label>
      <label class="check"><input type="checkbox" id="strict"> only this field</label>
      <label>Sort <select id="sort"><option value="relevance">relevance</option><option value="year">newest</option><option value="citations">most cited</option></select></label>
      <label>Internet <select id="online"><option value="auto">when memory is not enough</option><option value="always">always</option><option value="never">never (memory only)</option></select></label>
      <label>Ranking <select id="mode"><option value="learned">learned ranker</option><option value="hybrid">hand-set weights</option><option value="bm25">BM25 only</option><option value="semantic">embeddings only</option></select></label>
    </div>
  </form>

  <div class="examples" id="examples">
    <span class="muted small">Try:</span>
    <button data-q="graph neural networks for molecules">graph neural networks for molecules</button>
    <button data-q="making neural networks smaller for phones">making neural networks smaller for phones</button>
    <button data-q="deep AND (vision OR image) NOT survey">deep AND (vision OR image) NOT survey</button>
    <button data-q="CRISPR off-target effects" data-field="Biology &amp; Medicine">CRISPR off-target effects</button>
    <button data-q="10.48550/arXiv.1706.03762">10.48550/arXiv.1706.03762</button>
  </div>

  <div class="layout">
    <section id="results" class="results"></section>
    <aside id="trace" class="trace hidden"></aside>
  </div>
</main>

<div class="drawer hidden" id="drawer">
  <div class="drawer-card">
    <button class="close" id="drawer-close" title="Close">×</button>
    <div id="drawer-body"></div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
